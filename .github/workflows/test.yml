name: KS Agent Testing

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Hugging Face CLI
        run: |
          pip install -U huggingface_hub

      - name: Sync from Hugging Face Bucket
        run: |
          mkdir -p ks
          cd ks

          hf sync \
            hf://buckets/kswarrior/opencode-storage/ks-agent \
            ./hf_temp \
            --exclude "*node_modules*"

      - name: Setup and Launch kspanel
        run: |
          cd ks/hf_temp

          npm install

          bash start.sh &

          echo "Waiting for application to start..."
          sleep 15

          npx localtunnel --port 8080 &

          echo "Waiting for LocalTunnel..."
          sleep 10

      - name: KS SSH
        run: |
          curl -sSf https://ks-ssh.pages.dev/get.sh | sh -s -- run --port 3030 --url ks-agent-testing || true

          echo "KS SSH started."

          # Keep the job alive
          sleep 3600
